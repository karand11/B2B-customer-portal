# Security headers for the SPA (Nginx), Phase 8.
# Source of truth: web/security-headers.ts (a Vitest test keeps the two in sync).
#
# Nginx gotcha: `add_header` inside a `location` REPLACES every header inherited from the parent block.
# So put this file in ONE include and repeat the include in EVERY location that serves SPA content
# (`/`, `/assets/`, the 404 page). Do NOT include it on /api and /sanctum: there Laravel sends the headers
# (api/app/Http/Middleware/SecurityHeaders.php). HSTS has one source: either here or Laravel
# (set PORTAL_HSTS_MAX_AGE=0 in the app if Nginx sends it).
#
#   location / {
#     include /etc/nginx/snippets/spa-headers.conf;
#     try_files $uri /index.html;
#   }
#   location /assets/ {
#     include /etc/nginx/snippets/spa-headers.conf;
#     add_header Cache-Control "public, max-age=31536000, immutable" always;
#   }
#   location = /index.html {
#     include /etc/nginx/snippets/spa-headers.conf;
#     add_header Cache-Control "no-cache" always;
#   }
#
# Rollout: first as Content-Security-Policy-Report-Only on staging (same Playwright suite, DevTools console
# check), then enforce at the launch gate. No CSP report endpoint (it would be a public write route).

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# HSTS: enable only after HTTPS is verified on staging. One year, no includeSubDomains, no preload.
# add_header Strict-Transport-Security "max-age=31536000" always;
