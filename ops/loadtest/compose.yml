# Representative server for the catalog-search load check (docs/phase-7-design.md section 6.3).
#   export LOADTEST_PASSWORD="$(openssl rand -hex 16)"   # required: the same value seeds the users and logs the script in
#   docker compose -f ops/loadtest/compose.yml up -d --build
#   docker compose -f ops/loadtest/compose.yml exec app php artisan migrate --force
#   docker compose -f ops/loadtest/compose.yml exec app php artisan portal:loadtest-seed
#   LOADTEST_BASE_URL=http://localhost:8200 node e2e/loadtest/catalog-search.mjs
# Throwaway credentials and APP_KEY: this rig must never hold real data or be exposed to a network.
name: portal-loadtest

x-app-env: &app-env
  APP_ENV: loadtest
  APP_DEBUG: "false"
  APP_KEY: base64:bG9hZHRlc3Qta2V5LU5PVC1hLXNlY3JldC0xMjM0NTY=
  APP_URL: http://localhost:8200
  APP_URL_WEB: http://localhost:8200
  SANCTUM_STATEFUL_DOMAINS: localhost:8200
  SESSION_SECURE_COOKIE: "false"
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: portal_load
  DB_USERNAME: portal
  DB_PASSWORD: loadtest
  CACHE_STORE: database
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database
  MAIL_MAILER: log
  LOG_LEVEL: warning
  LOG_CHANNEL: stderr
  LOADTEST_PASSWORD: ${LOADTEST_PASSWORD:?set LOADTEST_PASSWORD (12+ characters) before starting the rig}

services:
  db:
    image: postgres:16@sha256:ce81150802644ddfac1db4da9e63be6f2a3818aa6ee98a7a28838aeea65dc37a
    environment:
      POSTGRES_DB: portal_load
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: loadtest
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - shared_preload_libraries=auto_explain
      # EXPLAIN capture is off unless AUTO_EXPLAIN_MS=0 (or a threshold) is set: read plans with `docker compose logs db`.
      - -c
      - auto_explain.log_min_duration=${AUTO_EXPLAIN_MS:--1}
      - -c
      - auto_explain.log_analyze=on
      - -c
      - auto_explain.log_buffers=on
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_load"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ../..
      dockerfile: ops/loadtest/Dockerfile
    environment:
      <<: *app-env
    # Cache config/routes/events at start so the container runs like a production image.
    command: sh -c "php artisan config:cache && php artisan route:cache && php artisan event:cache && exec php-fpm"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2g

  web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8200:80"
    depends_on:
      - app
