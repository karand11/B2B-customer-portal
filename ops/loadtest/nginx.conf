# Load-rig nginx: serves the SPA build (if mounted) and forwards /api, /sanctum and /up to php-fpm,
# like the Phase 8 production layout. Not a production config (see docs/ops/nginx-spa-headers.conf for the headers).
worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  access_log off;
  error_log /dev/stderr warn;

  # The load script sets X-Forwarded-For per virtual user so per-IP limiters behave like behind a load balancer.
  # Rig only: trusting every source is acceptable on an isolated Docker network, never in production.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  upstream php { server app:9000; keepalive 16; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    root /usr/share/nginx/html;   # mount web/dist here (optional for the API load test)

    location ~ ^/(api|sanctum|up)(/|$) {
      include fastcgi_params;
      fastcgi_pass php;
      fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
      fastcgi_param SCRIPT_NAME /index.php;
      fastcgi_param REQUEST_URI $request_uri;
      fastcgi_read_timeout 60s;
    }

    location / { try_files $uri /index.html; }
  }
}
